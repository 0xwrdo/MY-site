        body { background: var(--bg); color: var(--text); font-family: var(--font-body); margin: 0; }
        .is-subpage #navbar { background: rgba(8, 8, 8, 0.95); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .page-header { padding: 160px 0 80px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .page-header h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin-bottom: 1rem; font-weight: 800; }
        .page-header p { color: var(--text-dim); max-width: 650px; margin: 0 auto; font-size: 1.1rem; line-height: 1.6; }

        .content { max-width: 1220px; margin: 0 auto; padding: 0 1.5rem; }
        .block { padding: 80px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .block:last-child { border-bottom: none; }
        .block h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 3px; color: var(--copper); margin-bottom: 3rem; font-weight: 600; text-align: center; }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
        }
        .feature-card {
            background: var(--surface); border: 1px solid var(--border-soft); border-radius: 16px;
            padding: 2.5rem; text-align: center; transition: all 0.3s ease;
        }
        .feature-card:hover { border-color: var(--copper); transform: translateY(-5px); }
        .feature-card i { font-size: 2.5rem; color: var(--copper); margin-bottom: 1.5rem; display: block; }
        .feature-card h3 { font-size: 1.3rem; margin-bottom: 1rem; color: var(--text); }
        .feature-card p { font-size: 0.95rem; color: var(--text-dim); line-height: 1.6; }

        .gallery {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem; margin-top: 1rem;
        }
        .gallery-item {
            position: relative; aspect-ratio: 4/3; background: var(--surface);
            border-radius: 12px; overflow: hidden; border: 1px solid var(--border-soft);
            transition: all 0.3s ease;
        }
        .gallery-item:hover { border-color: var(--copper); transform: translateY(-5px); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: 0.3s; loading: lazy; }
        .gallery-item:hover img { opacity: 1; }

        @media (max-width: 600px) {
            .page-header { padding: 120px 1.5rem 60px; }
            .block { padding: 50px 0; }
        }
    </style>
